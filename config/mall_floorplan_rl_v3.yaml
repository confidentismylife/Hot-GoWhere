# 武汉保利广场 1F — Real Shopping Mall Evacuation Scenario
#
# 200m × 120m, 多翼结构, 中央中庭, 6 exits, 30+ shops
# Layout: 多翼布局, 中央回廊中庭, 东餐厅区/西影院区
#
# Usage:
#   python main.py --config config/mall_floorplan.yaml --gradio
#   python main.py --config config/mall_floorplan.yaml --agents 500 --record

simulation:
  num_agents: 600              # Mall typical occupancy on one floor
  duration: 360                 # 6 minutes (longer due to larger area)
  dt: 0.1
  decision_interval: 10.0          # Longer interval → fewer LLM requests, lower backlog
  seed: 42

environment:
  type: "mall"                  # NEW: mall floor plan mode
  floorplan: "wuhan_baoli_1f"   # 武汉保利广场
  width: 200.0                  # Overridden by floorplan, fallback for compatibility
  height: 120.0                 # Overridden by floorplan, fallback for compatibility
  disaster: "fire"
  disaster_origin: [170.0, 100.0]  # 东南餐饮区 (太二酸菜鱼、麦当劳附近)
  disaster_spread_rate: 0.10       # Faster spread → LLM proactive advantage matters more

  # Use floor plan defaults (6 exits), comment to override
  # exit_positions:
  #   - [55.0, 2.0]     # 北1 — 主入口
  #   - [145.0, 2.0]    # 北2 — 次入口
  #   - [2.0, 45.0]     # 西1 — 消防楼梯
  #   - [2.0, 85.0]     # 西2 — 影院出口
  #   - [198.0, 60.0]   # 东1 — 餐厅出口
  #   - [100.0, 118.0]  # 南 — 正门入口

llm:
  enabled: true                 # Set false (or use --no-llm) for heuristic-only runs
  model: "Qwen/Qwen2.5-7B-Instruct-AWQ"
  quantization: "awq"
  max_model_len: 4096
  gpu_memory_utilization: 0.75      # 7B AWQ ~3.5GB + KV cache, safe for 24GB 4090
  temperature: 0.3
  fixed_seed: true                  # LLM 采样 seed = 仿真 seed（压低实验噪声）
  max_tokens: 256                    # Chinese JSON with reasoning needs ~150-200 tokens
  batch_size: 32
  lora_path: ""

knowledge_base:
  persist_dir: "./data/disaster_kb"
  embedding_model: "BAAI/bge-small-zh-v1.5"

agents:
  age_groups:
    young:    {min: 18, max: 35, weight: 0.40}    # Mall skews younger
    middle:   {min: 36, max: 55, weight: 0.40}
    elderly:  {min: 56, max: 80, weight: 0.15}
    child:    {min: 5,  max: 17, weight: 0.05}    # Children in mall
  familiarity_distribution:
    low:     {range: [0.0, 0.3], weight: 0.4}     # More first-time visitors
    medium:  {range: [0.3, 0.7], weight: 0.4}
    high:    {range: [0.7, 1.0], weight: 0.2}     # Staff & regulars
  family_group_probability: 0.35                   # Higher family ratio in mall
  max_speed_range: [0.8, 2.0]

visualization:
  enabled: true
  width: 1400     # 200m × 7 px/m
  height: 840     # 120m × 7 px/m, aspect ratio 5:3

vlm:
  enabled: false
  model: "Qwen/Qwen2.5-VL-7B-Instruct-AWQ"
  call_interval: 30

yolo:
  model: "yolov8n.pt"
  conf_threshold: 0.35
  call_interval: 10

diffusion:
  enabled: false
  d_model: 256
  nhead: 8
  num_layers: 6
  num_inference_steps: 100
  checkpoint: "./checkpoints/diffusion_final.pt"

# ================================================================
# LLM → IRL → RL Three-Tier Cascade Architecture
# ================================================================
# IRL (Inverse Reinforcement Learning) — recover reward weights from LLM behavior
irl:
  enabled: false                          # Enable trajectory collection during simulation
  output_dir: "data/trajectories"         # Where to save .jsonl trajectory files
  min_trajectories_per_persona: 10        # Minimum trajectories for IRL fitting
  learning_rate: 0.01                     # MaxEnt IRL gradient step size
  max_iter: 500                           # Max IRL iterations per persona

# RL Zone Scheduling — 分区独立 PPO（Zone-PPO） zone-level exit recommendations
rl_scheduling:
  enabled: true                           # Enable RL zone scheduler during simulation
  pretrained_weights: "data/rl_policy_v3.json"  # Trained Zone-PPO policy
  irl_weights: "data/irl_weights.json"   # Path to IRL-learned reward weights
  rl_inference_interval: 1                # Ticks between RL inference (1 = every tick)
  smoke_block_threshold: 0.6              # Exits with smoke > this are never recommended
  fire_path_block: true                   # Also block exits whose straight-line path crosses fire

# Zone definitions for RL scheduler (4 quadrants of 200m×120m mall)
zones:
  - {id: 0, name: "西北区", x_min: 0,   x_max: 100, y_min: 60, y_max: 120, primary_exits: [0,2,3], description: "商场西北区域，靠近万达影城、海底捞、星巴克"}
  - {id: 1, name: "东北区", x_min: 100, x_max: 200, y_min: 60, y_max: 120, primary_exits: [1,4], description: "商场东北区域，靠近迪卡侬、MUJI"}
  - {id: 2, name: "西南区", x_min: 0,   x_max: 100, y_min: 0,  y_max: 60,  primary_exits: [2,3,5], description: "商场西南区域，靠近Apple、华为、泡泡玛特"}
  - {id: 3, name: "东南区", x_min: 100, x_max: 200, y_min: 0,  y_max: 60,  primary_exits: [4,5], description: "商场东南区域，靠近餐饮区、太二酸菜鱼、麦当劳（火源区域）"}
