# 北京地铁国贸站 B1 — Metro Station Evacuation Scenario
# 120m × 60m, 2 platforms, 4 staircases, 6 exits, tunnel connections
simulation:
  num_agents: 400
  duration: 300
  dt: 0.1
  decision_interval: 3.0
  seed: 42

environment:
  type: "metro"
  floorplan: "guomao_station_b1"
  width: 120.0
  height: 60.0
  disaster: "fire"
  disaster_origin: [90.0, 15.0]
  disaster_spread_rate: 0.08
  exit_positions:
    - [10.0, 2.0]
    - [55.0, 2.0]
    - [110.0, 2.0]
    - [10.0, 58.0]
    - [55.0, 58.0]
    - [110.0, 58.0]

llm:
  model: "Qwen/Qwen2.5-3B-Instruct-AWQ"
  quantization: "awq"
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  temperature: 0.3
  max_tokens: 128
  batch_size: 32

knowledge_base:
  persist_dir: "./data/disaster_kb"
  embedding_model: "BAAI/bge-small-zh-v1.5"

agents:
  age_groups:
    young:    {min: 18, max: 35, weight: 0.45}
    middle:   {min: 36, max: 55, weight: 0.40}
    elderly:  {min: 56, max: 80, weight: 0.10}
    child:    {min: 5,  max: 17, weight: 0.05}
  familiarity_distribution:
    low:     {range: [0.0, 0.3], weight: 0.5}
    medium:  {range: [0.3, 0.7], weight: 0.3}
    high:    {range: [0.7, 1.0], weight: 0.2}
  family_group_probability: 0.20
  max_speed_range: [0.8, 2.0]

irl:
  enabled: false
  output_dir: "data/trajectories"
  min_trajectories_per_persona: 10
  learning_rate: 0.01
  max_iter: 500

rl_scheduling:
  enabled: false
  pretrained_weights: ""
  irl_weights: "data/irl_weights.json"
  rl_inference_interval: 1

# Metro: 2 zones (north side / south side of platforms)
zones:
  - {id: 0, name: "北站台区", x_min: 0, x_max: 120, y_min: 30, y_max: 60, primary_exits: [0,1,2], description: "北侧站台，靠近A/B/C出口"}
  - {id: 1, name: "南站台区", x_min: 0, x_max: 120, y_min: 0,  y_max: 30, primary_exits: [3,4,5], description: "南侧站台，靠近D/E/F出口"}
